name: Publish v1.0.7-rc4 pre-release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.7-rc4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.7-rc4 >/dev/null 2>&1; then
            echo "Release v1.0.7-rc4 already exists; leaving it unchanged."
          else
            gh release create v1.0.7-rc4 \
              --target main \
              --title "OpenMW 0.51 Korean Translation v1.0.7-rc4" \
              --notes-file release/RELEASE_NOTES_v1.0.7-rc4.md \
              --prerelease
          fi
